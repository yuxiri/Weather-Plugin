<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:MiSans;src:url("./MiSansVF.ttf") format("truetype");font-style:normal;font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
body{width:1024px;margin:0;background:#f7faff;color:#10284c;font-family:MiSans,"Microsoft YaHei",Arial,sans-serif}
#container{width:1024px;padding:14px 18px 14px;background:#f7faff}
.hero{min-height:158px;position:relative;overflow:hidden;border-radius:24px;padding:21px 38px;background:linear-gradient(112deg,#e9f6ff 0%,#e3f3ff 62%,#edf8ff 100%);display:flex;align-items:center}
.hero-copy{position:relative;z-index:1;max-width:680px}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:#6a9bd1}
h1{font-size:36px;line-height:1.15;letter-spacing:.01em;margin:9px 0 6px;color:#092a5c;overflow-wrap:anywhere}
.intro{font-size:16px;line-height:1.38;color:#617da5;margin:0;max-width:650px}
.hero-art{position:absolute;width:234px;height:144px;right:28px;top:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin-top:11px;align-items:stretch}
.feature{padding:13px 15px 14px;border-radius:20px;overflow:hidden;min-width:0}
.feature-wide{grid-column:1/-1}
.feature-wide .rows{grid-template-columns:repeat(2,minmax(0,1fr))}
.tone-blue{background:linear-gradient(135deg,#e9f5fd,#f1f9ff)}
.tone-purple,.tone-violet{background:linear-gradient(135deg,#f0edff,#f7f5ff)}
.tone-green{background:linear-gradient(135deg,#e9f8f2,#f1fbf7)}
.tone-orange{background:linear-gradient(135deg,#fff1e5,#fff8f0)}
.tone-pink,.tone-rose{background:linear-gradient(135deg,#fff0f4,#fff6f8)}
.tone-cyan{background:linear-gradient(135deg,#e8f8fc,#f2fbfd)}
.feature-head{display:flex;align-items:center;gap:11px;min-height:48px;margin-bottom:9px}
.feature-head>div:last-child{min-width:0}
.icon{flex:0 0 48px;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px #21426416}
.icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tone-blue .icon,.tone-cyan .icon{background:linear-gradient(145deg,#62a9ff,#347af0)}
.tone-purple .icon,.tone-violet .icon{background:linear-gradient(145deg,#a28aff,#7554ed)}
.tone-green .icon{background:linear-gradient(145deg,#58d1a6,#35b88d)}
.tone-orange .icon{background:linear-gradient(145deg,#ffad55,#ff7e1d)}
.tone-pink .icon,.tone-rose .icon{background:linear-gradient(145deg,#ff779c,#f24478)}
h2{font-size:20px;line-height:1.22;margin:0 0 4px;color:#0c2b5b;overflow-wrap:anywhere}
.subtitle{font-size:14px;line-height:1.36;color:#7186a8;margin:0;overflow-wrap:anywhere}
.rows{display:grid;gap:6px;min-width:0}
.row{min-height:36px;border-radius:12px;padding:7px 10px 7px 12px;background:#ffffffc7;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.command{font-size:15px;line-height:1.32;color:#1766bb;font-weight:650;overflow-wrap:anywhere;word-break:break-word;min-width:0;flex:1}
.note{flex:0 1 auto;max-width:35%;min-width:0;font-size:12px;line-height:1.32;color:#7182a3;text-align:right;overflow-wrap:anywhere;word-break:break-word}
.note:empty{display:none}
.help-guide{margin-top:10px;padding:8px 10px;border-radius:14px;background:linear-gradient(110deg,#eaf5fd,#f1f8ff);display:grid;grid-template-columns:94px minmax(0,1fr);gap:8px;align-items:center}
.help-guide-title{padding-left:2px;font-size:13px;line-height:1.35;font-weight:700;color:#58799f;white-space:nowrap}
.guide-item{min-height:34px;padding:6px 10px;border-radius:10px;background:#ffffffd4;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.guide-command{font-size:14px;line-height:1.3;font-weight:650;color:#1766bb;white-space:nowrap}
.guide-note{font-size:12px;line-height:1.3;color:#7182a3;text-align:right;overflow-wrap:anywhere}
.footer{margin:10px 4px 0;color:#7186a8;font-size:12px;line-height:1.45;text-align:right}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 32 32"><circle cx="13.5" cy="13.5" r="8.5"/><path d="m20 20 7 7"/></symbol>
  <symbol id="i-pin" viewBox="0 0 32 32"><path d="M25 13c0 7-9 16-9 16S7 20 7 13a9 9 0 1 1 18 0Z"/><circle cx="16" cy="13" r="3"/><path d="m5 27 7-3 5 2 10-4"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 32 32"><path d="M26 6C14 6 6 11 6 20a6 6 0 0 0 6 6c9 0 14-8 14-20Z"/><path d="M5 28c4-8 9-12 17-16M14 20l-1-6m6 2 5 1"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 32 32"><rect x="5" y="7" width="22" height="21" rx="3"/><path d="M10 4v6m12-6v6M5 13h22"/></symbol>
  <symbol id="i-bell" viewBox="0 0 32 32"><path d="M24 13a8 8 0 0 0-16 0c0 9-3 9-3 11h22c0-2-3-2-3-11Zm-11 15a3 3 0 0 0 6 0"/></symbol>
  <symbol id="i-send" viewBox="0 0 32 32"><path d="m28 4-9 24-5-10-10-5 24-9Z"/><path d="M14 18 28 4"/></symbol>
  <symbol id="i-palette" viewBox="0 0 32 32"><path d="M16 4C8.8 4 4 9.4 4 16a12 12 0 0 0 12 12c2.3 0 3-1.2 3-2.6 0-1.1-.8-1.8-.8-2.8 0-1.5 1-2.4 2.5-2.4H23c3 0 5-2.3 5-5.2C28 9.5 22.7 4 16 4Z"/><circle cx="10" cy="13" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="21" cy="11" r="1"/></symbol>
  <symbol id="i-settings" viewBox="0 0 32 32"><circle cx="16" cy="16" r="4"/><path d="m13 4-.7 3a10 10 0 0 0-2.4 1.4L7 7l-3 5 2.2 2a11 11 0 0 0 0 3L4 19l3 5 2.9-1.4a10 10 0 0 0 2.4 1.4l.7 3h6l.7-3a10 10 0 0 0 2.4-1.4L25 24l3-5-2.2-2a11 11 0 0 0 0-3L28 12l-3-5-2.9 1.4a10 10 0 0 0-2.4-1.4L19 4h-6Z"/></symbol>
</svg>
<div id="container">
  <header class="hero">
    <div class="hero-copy">
      <div class="eyebrow">WEATHER / 天气插件</div>
      <h1>{{title}}</h1>
      <p class="intro">{{subtitle}}</p>
    </div>
    <svg class="hero-art" viewBox="0 0 280 170" aria-hidden="true">
      <circle cx="187" cy="76" r="38" fill="#ffc94f"/><g stroke="#ffc94f" stroke-width="6" stroke-linecap="round"><path d="M187 18v-9M187 143v-9M129 76h-10M255 76h-10M146 35l-7-7m96 96-7-7m0-82-7 7m-82 82-7 7"/></g>
      <path d="M33 103c0-18 14-32 32-32 14 0 26 9 30 22 4-4 10-7 17-7 15 0 27 12 27 27 0 14-11 25-25 25H64c-17 0-31-15-31-35Z" fill="#cbe8ff" opacity=".75"/>
      <path d="M130 113c3-18 18-31 37-31 17 0 31 10 36 25 4-5 11-8 18-8 14 0 25 11 25 25 0 13-11 24-24 24h-66c-16 0-28-14-26-35Z" fill="#fff" opacity=".92"/>
      <path d="M151 126c3-18 18-31 37-31 17 0 31 10 36 25 4-5 11-8 18-8 14 0 25 11 25 25 0 13-11 24-24 24h-66c-16 0-28-14-26-35Z" fill="#75baff"/>
    </svg>
  </header>
  <main class="grid">
    {{each cards card}}
    <section class="feature tone-{{card.tone}} {{if card.wide}}feature-wide{{/if}}">
      <div class="feature-head">
        <div class="icon"><svg aria-hidden="true"><use href="#i-{{card.icon}}"/></svg></div>
        <div><h2>{{card.title}}</h2><p class="subtitle">{{card.subtitle}}</p></div>
      </div>
      <div class="rows">{{each card.rows row}}<div class="row"><span class="command">{{row.command}}</span><span class="note">{{row.note}}</span></div>{{/each}}</div>
    </section>
    {{/each}}
  </main>
  {{if showHelpGuide}}
  <aside class="help-guide">
    <div class="help-guide-title">帮助与设置</div>
    {{each helpGuide item}}
    <div class="guide-item"><span class="guide-command">{{item.command}}</span><span class="guide-note">{{item.note}}</span></div>
    {{/each}}
  </aside>
  {{/if}}
  <footer class="footer">{{footer}}</footer>
</div>
</body>
</html>
