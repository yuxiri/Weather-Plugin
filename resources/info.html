<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;background:white;font-family:Arial,"Microsoft YaHei",sans-serif;color:#0c2234}#container{width:760px;padding:18px;background:white}.card{border-radius:28px;background:#f2f8fc;padding:32px 38px 35px}.eyebrow{font-size:13px;color:#6086a3;letter-spacing:.08em;font-weight:700}h1{font-size:29px;margin:10px 0 24px}.line{background:white;border-radius:13px;padding:13px 17px;margin:9px 0;font-size:17px;line-height:1.5;white-space:pre-wrap}.footer{font-size:12px;color:#73899e;margin:20px 3px 0}
</style>
</head>
<body><div id="container"><div class="card"><div class="eyebrow">WEATHER / 天气插件</div><h1>{{title}}</h1>{{each lines line}}<div class="line">{{line}}</div>{{/each}}<div class="footer">Yunzai · 天气数据由 Open-Meteo 提供</div></div></div></body>
</html>
